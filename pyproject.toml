[project]
name = "football-vision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aitorlarrinoa", email = "aitorlarrinoa231@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
]

[project.scripts]
football-vision = "football_vision:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
heavy = [
    "scikit-learn>=1.9.0",
    "supervision>=0.30.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
